<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Parallel Stream</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title-row">
      <nav class="tabs">
        <button class="tab active" data-tab="multiview" type="button">Multiview</button>
        <button class="tab" data-tab="probe" type="button">Debug</button>
      </nav>
      <span id="status" class="status"></span>
    </div>
  </header>

  <main>
    <!-- ===== Multiview パネル(入口) ===== -->
    <div class="panel" data-panel="multiview">
      <div class="actions">
        <button id="open-multiview" type="button" class="primary">▶ マルチビューを開く</button>
      </div>
      <p class="hint">配信の追加・配置・音量調整は専用ページで行います。専用ページのツールバーから1つずつ追加できます。</p>

      <section class="settings">
        <h2>設定</h2>
        <label class="setting-row">
          <input type="checkbox" id="set-startmuted" checked />
          <span>起動時に全ミュート <span class="hint">(各枠の S で1つだけ鳴らす)</span></span>
        </label>
        <label class="setting-row">
          <span>マスタ音量の初期値</span>
          <input type="range" id="set-mastervol" min="0" max="100" value="100" />
          <span id="set-mastervol-val" class="hint">100</span>
        </label>
      </section>

      <section class="last-run">
        <h2>保存中の配信 <span class="hint">(専用ページで追加した分)</span></h2>
        <div id="saved-list" class="block">
          <span class="empty">なし</span>
        </div>
        <div class="actions">
          <button id="clear-saved" type="button">保存をクリア</button>
        </div>
      </section>
    </div>

    <!-- ===== Probe パネル ===== -->
    <div class="panel hidden" data-panel="probe">
      <div class="actions">
        <button id="rerun" type="button">Re-run probes</button>
        <button id="copy-json" type="button">Copy report as JSON</button>
        <button id="copy-md" type="button">Copy report as Markdown</button>
      </div>

      <section>
        <h2>Custom APIs <span class="hint">(標準外として検出された namespace)</span></h2>
        <div id="custom-apis" class="block"></div>
      </section>

      <section>
        <h2>Windows Probe Result</h2>
        <div id="windows-probe" class="block"></div>
      </section>

      <section>
        <h2>Fullscreen Probe Result</h2>
        <div id="fullscreen-probe" class="block"></div>
      </section>

      <section>
        <h2>Webview / Custom Namespace Probe</h2>
        <div id="webview-probe" class="block"></div>
      </section>

      <section>
        <h2>Standard APIs <span class="hint">(参考: 想定範囲内)</span></h2>
        <div id="standard-apis" class="block"></div>
      </section>

      <section>
        <h2>Errors</h2>
        <div id="errors" class="block"></div>
      </section>

      <section>
        <h2>Meta</h2>
        <div id="meta" class="block"></div>
      </section>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
