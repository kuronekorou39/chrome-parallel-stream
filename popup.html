<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- スマホでタブとして開かれた場合に実寸表示するため(無いと縮小描画で文字が極小になる) -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parallel Stream</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title-row">
      <nav class="tabs">
        <button class="tab active" data-tab="multiview" type="button">Multiview</button>
        <button class="tab" data-tab="probe" type="button">Debug</button>
      </nav>
      <span id="status" class="status"></span>
    </div>
  </header>

  <main>
    <!-- ===== Multiview パネル(入口) ===== -->
    <div class="panel" data-panel="multiview">
      <button id="open-multiview" type="button" class="hero-btn">
        <span class="hero-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span class="hero-text">
          <span class="hero-title">マルチビューを開く</span>
          <span class="hero-sub">複数の配信を 1 画面に並べて同時視聴</span>
        </span>
        <span class="hero-arrow" aria-hidden="true">▶</span>
      </button>
      <p class="hint">追加・配置・画質・音量は専用ページで操作します(起動時は全ミュート)。</p>

      <section class="last-run">
        <div class="saved-head">
          <h2>保存中の配信</h2>
          <button id="clear-saved" type="button">クリア</button>
        </div>
        <div id="saved-list" class="block">
          <span class="empty">なし</span>
        </div>
      </section>
    </div>

    <!-- ===== Probe パネル ===== -->
    <div class="panel hidden" data-panel="probe">
      <div class="actions">
        <button id="rerun" type="button">Re-run probes</button>
        <button id="copy-json" type="button">Copy report as JSON</button>
        <button id="copy-md" type="button">Copy report as Markdown</button>
      </div>

      <section>
        <h2>Custom APIs <span class="hint">(標準外として検出された namespace)</span></h2>
        <div id="custom-apis" class="block"></div>
      </section>

      <section>
        <h2>Windows Probe Result</h2>
        <div id="windows-probe" class="block"></div>
      </section>

      <section>
        <h2>Fullscreen Probe Result</h2>
        <div id="fullscreen-probe" class="block"></div>
      </section>

      <section>
        <h2>Webview / Custom Namespace Probe</h2>
        <div id="webview-probe" class="block"></div>
      </section>

      <section>
        <h2>Standard APIs <span class="hint">(参考: 想定範囲内)</span></h2>
        <div id="standard-apis" class="block"></div>
      </section>

      <section>
        <h2>Errors</h2>
        <div id="errors" class="block"></div>
      </section>

      <section>
        <h2>Meta</h2>
        <div id="meta" class="block"></div>
      </section>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
