<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>枠クラッシュの切り分け</title>
    <style>
      /* multiview の CSS は一切読み込まない。枠の見た目に関わるものを持ち込まないため。 */
      body { margin: 0; font: 14px/1.6 system-ui, sans-serif; background: #111; color: #ddd; }
      header { padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      input[type='text'] { flex: 1 1 380px; min-width: 240px; padding: 6px 8px; background: #1c1c1c; color: #eee; border: 1px solid #444; border-radius: 4px; }
      button { padding: 6px 12px; background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
      button:hover { background: #383838; }
      #note { padding: 0 12px 8px; color: #999; }
      #stage { position: relative; width: 960px; height: 540px; max-width: 100%; background: #000; margin: 0 12px; }
      #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      #log { margin: 10px 12px; height: 220px; overflow: auto; background: #0a0a0a; border: 1px solid #333; padding: 8px; white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <header>
      <input type="text" id="url" value="https://www.youtube.com/watch?v=" />
      <button id="bare">素の iframe で開く</button>
      <button id="same">multiview と同じ属性で開く</button>
      <button id="clear">枠を閉じる</button>
      <button id="copy">ログをコピー</button>
    </header>
    <p id="note">
      multiview の JS も CSS も読み込んでいません。枠を 1 つ置くだけのページです。ここで落ちるなら multiview の作りは無関係、
      落ちないなら multiview 側に原因があります。
    </p>
    <div id="stage"></div>
    <div id="log"></div>

    <script>
      // 枠(iframe)の中の crash-probe.js は「最上位が github.io のときだけ」動く。このページも
      // github.io なので、multiview を通さずに同じ計測ログを取れる。
      const ALLOW = 'autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write';
      const stage = document.getElementById('stage');
      const logEl = document.getElementById('log');
      const lines = [];
      const beat = new Map();
      const DEAD_MS = 4000;

      function push(s) {
        lines.push(s);
        if (lines.length > 800) lines.splice(0, lines.length - 800);
        logEl.textContent = lines.slice(-200).join('\n');
        logEl.scrollTop = logEl.scrollHeight;
      }

      function open(url, allow) {
        stage.textContent = '';
        beat.clear();
        const f = document.createElement('iframe');
        if (allow) f.allow = ALLOW;
        f.src = url;
        stage.appendChild(f);
        push('---- ' + (allow ? 'multiview と同じ属性' : '素の iframe') + ' で ' + url + ' を開いた ----');
      }

      document.getElementById('bare').onclick = () => open(document.getElementById('url').value.trim(), false);
      document.getElementById('same').onclick = () => open(document.getElementById('url').value.trim(), true);
      document.getElementById('clear').onclick = () => { stage.textContent = ''; beat.clear(); push('---- 枠を閉じた ----'); };
      document.getElementById('copy').onclick = async () => {
        await navigator.clipboard.writeText(lines.join('\n'));
        push('(ログをコピーしました)');
      };

      window.addEventListener('message', (e) => {
        const d = e.data;
        if (!d || d.__multiviewProbe !== true) return;
        const tag = d.frame;
        if (d.ev === 'beat') beat.set(tag, Date.now());
        push(String(d.ms).padStart(6) + 'ms ' + tag + ' ' + d.ev + (d.detail !== undefined ? ' ' + d.detail : ''));
      });

      // 心拍が途切れた = そのフレームが落ちた。裏タブではタイマーが絞られるので判定しない。
      setInterval(() => {
        if (document.hidden) return;
        const now = Date.now();
        for (const [tag, at] of beat) {
          if (now - at > DEAD_MS) {
            beat.delete(tag);
            push('------ ' + tag + ' の心拍が ' + (now - at) + 'ms 途切れた = このフレームは落ちた ------');
          }
        }
      }, 1000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        const now = Date.now();
        for (const tag of beat.keys()) beat.set(tag, now);
      });
    </script>
  </body>
</html>
