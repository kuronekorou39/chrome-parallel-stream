<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Multiview</title>
  <link rel="stylesheet" href="multiview.css" />
</head>
<body>
  <div id="toolbar">
    <span class="tb-item" title="表示中の配信数">枠 <span id="count">0</span>/20</span>
    <button id="add-open-btn" class="tb-btn tb-btn-primary" title="枠を追加">＋ 追加</button>
    <button id="tile-btn" class="tb-btn" title="全部をタイル状に整列">整列</button>
    <button id="adskip-btn" class="tb-btn" title="YouTube枠の広告を自動スキップ(既定オフ)。Twitchは vaft で常時ブロック。">広告スキップ</button>
    <span class="tb-item" title="全体の音量(全枠まとめて。0でミュート)"><span id="master-vol-icon">🔇</span><input type="range" id="master-vol" min="0" max="100" value="0" /></span>
    <button id="perf-btn" class="tb-btn" title="パフォーマンス(FPS・CPU・メモリ)を表示">📊</button>
    <button id="layout-pos-btn" class="tb-btn" title="メニューの表示位置を変える">位置</button>
    <button id="toolbar-toggle" class="tb-btn" title="メニューを隠す">隠す</button>
  </div>
  <button id="toolbar-show" title="メニューを表示">≡ メニュー</button>

  <div id="pos-dialog" class="pos-dialog-overlay">
    <div class="pos-dialog" role="dialog" aria-label="メニューの位置">
      <div class="pos-dialog-title">メニューの位置</div>
      <div class="pos-grid">
        <button class="pos-pick pos-top" data-pos="top" type="button" title="上に配置">⬆<span>上</span></button>
        <button class="pos-pick pos-left" data-pos="left" type="button" title="左に配置">⬅<span>左</span></button>
        <div class="pos-grid-center">画面</div>
        <button class="pos-pick pos-right" data-pos="right" type="button" title="右に配置">➡<span>右</span></button>
        <button class="pos-pick pos-bottom" data-pos="bottom" type="button" title="下に配置">⬇<span>下</span></button>
      </div>
      <button id="pos-dialog-close" class="pos-dialog-close" type="button">閉じる</button>
    </div>
  </div>

  <div id="add-dialog" class="pos-dialog-overlay">
    <div class="pos-dialog" role="dialog" aria-label="枠を追加">
      <div class="pos-dialog-title">枠を追加</div>
      <div class="add-sites">
        <button class="site-chip" data-site="twitch" type="button" title="Twitch を開く">Twitch</button>
        <button class="site-chip" data-site="youtube" type="button" title="YouTube を開く">YouTube</button>
        <button class="site-chip" data-site="kick" type="button" title="Kick を開く">Kick</button>
        <button class="site-chip" data-site="openrec" type="button" title="OPENREC を開く">OPENREC</button>
      </div>
      <div class="add-url-row">
        <input type="text" id="add-url" class="tb-input" placeholder="配信ページの URL を貼り付け" />
        <button id="add-btn" class="tb-btn">追加</button>
      </div>
      <button id="add-dialog-close" class="pos-dialog-close" type="button">閉じる</button>
    </div>
  </div>

  <div id="perf-panel" hidden>
    <div class="perf-head">
      <span class="perf-title">📊 パフォーマンス</span>
      <button id="perf-close" type="button" title="閉じる">✕</button>
    </div>
    <div class="perf-rows"></div>
    <div class="perf-note">CPU/メモリは PC 全体の値。枠ごと・GPU は Chrome の Shift+Esc で。</div>
  </div>

  <div id="stage">
    <div id="stage-empty">配信がありません。メニューの「＋ 追加」から、サイトを選ぶか URL を貼って枠を追加できます。</div>
  </div>
  <script src="vendor/hls.min.js"></script>
  <script src="multiview.js"></script>
</body>
</html>
