<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Multiview</title>
  <link rel="stylesheet" href="multiview.css" />
</head>
<body>
  <div id="toolbar">
    <span class="tb-item" title="表示中の配信数">枠 <span id="count">0</span>/20</span>
    <span class="tb-sep"></span>
    <span class="tb-item">開く</span>
    <button class="site-chip" data-site="twitch" type="button" title="Twitch を開く">Twitch</button>
    <button class="site-chip" data-site="youtube" type="button" title="YouTube を開く">YouTube</button>
    <button class="site-chip" data-site="kick" type="button" title="Kick を開く">Kick</button>
    <button class="site-chip" data-site="openrec" type="button" title="OPENREC を開く">OPENREC</button>
    <span class="tb-sep"></span>
    <input type="text" id="add-url" class="tb-input" placeholder="URL を貼って Enter / 追加" />
    <button id="add-btn" class="tb-btn">追加</button>
    <button id="tile-btn" class="tb-btn" title="全部をタイル状に整列">整列</button>
    <button id="layout-btn" class="tb-btn" title="整形モード: 枠の移動・リサイズ専用(中身に触れない)">整形モード</button>
    <button id="adskip-btn" class="tb-btn" title="YouTube枠の広告を自動スキップ(既定はオフ。押すとオン)">広告スキップ</button>
    <span class="tb-sep"></span>
    <span class="tb-item" title="全体の音量(全枠まとめて。0でミュート。以後は各プレイヤーでも個別調整可)"><span id="master-vol-icon">🔇</span><input type="range" id="master-vol" min="0" max="100" value="0" /></span>
    <span class="tb-grow"></span>
    <span class="tb-hint">枠をクリックでヘッダ表示 / 🎨=透明・画質 / ⛶=最大化 / 音は各プレイヤーで</span>
    <button id="toolbar-toggle" class="tb-btn" title="ツールバーを隠す">▲ 隠す</button>
  </div>
  <button id="toolbar-show" title="ツールバーを表示">≡ メニュー</button>
  <div id="stage">
    <div id="stage-empty">配信がありません。上のツールバーの入力欄に URL を貼って「追加」を押すと、1つずつ枠が増えていきます。</div>
  </div>
  <script src="vendor/hls.min.js"></script>
  <script src="multiview.js"></script>
</body>
</html>
