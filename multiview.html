<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Multiview</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #grid {
      display: grid;
      width: 100vw;
      height: 100vh;
      gap: 2px;
      background: #000;
    }
    .cell { position: relative; background: #000; overflow: hidden; }
    .cell iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .cell .badge {
      position: absolute; top: 4px; left: 4px; z-index: 2;
      background: rgba(0,0,0,0.55); color: #c9d1d9;
      font: 11px/1.4 monospace; padding: 1px 6px; border-radius: 3px;
      pointer-events: none; max-width: 80%; overflow: hidden;
      white-space: nowrap; text-overflow: ellipsis;
    }
    .empty {
      color: #8b949e; font: 14px monospace; padding: 24px;
    }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script src="multiview.js"></script>
</body>
</html>
