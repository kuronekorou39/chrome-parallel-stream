<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- スマホで実寸表示するため必須(無いと約980px仮想幅に縮小描画され、文字・ボタンが極小になる)。
       枠ドラッグ中のピンチ誤爆でページごとズームしないよう拡大は禁止(OSのアクセシビリティ設定で上書き可)。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Multiview</title>
  <link rel="stylesheet" href="multiview.css" />
</head>
<body>
  <div id="toolbar">
    <span class="tb-item" title="表示中の配信数">枠 <span id="count">0</span>/20</span>
    <button id="add-open-btn" class="tb-btn tb-btn-primary" title="枠を追加">＋ 追加</button>
    <button id="tile-btn" class="tb-btn" title="全部をタイル状に整列">整列</button>
    <button id="mixer-btn" class="tb-btn" title="枠一覧 / ミキサー(下に隠れた枠を出す・表示切替・音量)">🎚 一覧</button>
    <button id="adskip-btn" class="tb-btn" title="YouTube枠の広告を自動スキップ(既定オフ)。Twitchは vaft で常時ブロック。">広告スキップ</button>
    <button id="light-btn" class="tb-btn" title="全部の枠を軽量プレイヤーへ切替/通常へ戻す(配信・動画ページを開いている枠が対象。スマホで複数枠を並べる時用)">⚡ 軽量</button>
    <span class="tb-item" title="全体の音量(全枠まとめて。0でミュート)"><span id="master-vol-icon">🔇</span><input type="range" id="master-vol" min="0" max="100" value="0" /></span>
    <button id="perf-btn" class="tb-btn" title="パフォーマンス(FPS・CPU・メモリ)を表示">📊</button>
    <button id="layout-pos-btn" class="tb-btn" title="メニューの表示位置を変える">位置</button>
    <button id="toolbar-toggle" class="tb-btn" title="メニューを隠す">隠す</button>
  </div>
  <button id="toolbar-show" title="メニューを表示">≡ メニュー</button>
  <button id="stack-restore" title="全画面表示を終了してタイル一覧に戻る">⛶ 全画面を終了</button>

  <!-- ≡ から出す縦リストメニュー(右クリックメニュー風。PC/スマホ共通)。
       上の4つ(追加・配置・一覧・パフォーマンス)はパネル/ダイアログを開くもの、最下段の広告スキップだけは
       その場で ON/OFF するトグルなので区切り線で分ける。各項目は既存ツールバーボタンの機能をそのまま呼ぶ。
       アイコンは固定幅の .mm-icon 列に入れ、絵文字/＋の幅差でラベル開始位置がずれないように揃える。
       backdrop はメニュー外タップを「閉じるだけ」にして、下のタイル(iframe)へ流さないための透明層。 -->
  <div id="main-menu-backdrop" hidden></div>
  <div id="main-menu" hidden>
    <button id="mm-add" type="button"><span class="mm-icon">＋</span><span class="mm-label">追加</span></button>
    <button id="mm-layout" type="button"><span class="mm-icon">📐</span><span class="mm-label">配置</span></button>
    <button id="mm-mixer" type="button"><span class="mm-icon">🎚</span><span class="mm-label">一覧</span></button>
    <button id="mm-perf" type="button"><span class="mm-icon">📊</span><span class="mm-label">パフォーマンス</span></button>
    <button id="mm-adskip" type="button"><span class="mm-icon">⏭</span><span class="mm-label">広告スキップ: OFF</span></button>
  </div>

  <div id="pos-dialog" class="pos-dialog-overlay">
    <div class="pos-dialog" role="dialog" aria-label="メニューの位置">
      <div class="pos-dialog-title">メニューの位置</div>
      <div class="pos-grid">
        <button class="pos-pick pos-top" data-pos="top" type="button" title="上に配置">⬆<span>上</span></button>
        <button class="pos-pick pos-left" data-pos="left" type="button" title="左に配置">⬅<span>左</span></button>
        <div class="pos-grid-center">画面</div>
        <button class="pos-pick pos-right" data-pos="right" type="button" title="右に配置">➡<span>右</span></button>
        <button class="pos-pick pos-bottom" data-pos="bottom" type="button" title="下に配置">⬇<span>下</span></button>
      </div>
      <button id="pos-dialog-close" class="pos-dialog-close" type="button">閉じる</button>
    </div>
  </div>

  <div id="add-dialog" class="pos-dialog-overlay">
    <div class="pos-dialog pos-dialog-movable" role="dialog" aria-label="枠を追加">
      <div class="pos-dialog-head">
        <span class="pos-dialog-title">枠を追加</span>
        <button id="add-dialog-close" class="pos-dialog-x" type="button" title="閉じる">✕</button>
      </div>
      <div class="pos-dialog-body">
        <div class="add-sites">
          <button class="site-chip" data-site="twitch" type="button" title="Twitch を開く">Twitch</button>
          <button class="site-chip" data-site="youtube" type="button" title="YouTube を開く">YouTube</button>
        </div>
        <div class="add-url-row">
          <input type="text" id="add-url" class="tb-input" placeholder="配信ページの URL を貼り付け" />
          <button id="add-btn" class="tb-btn">追加</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 📐 配置ダイアログ: 整列/整形の即実行と、現在の配置(URL・サイズ・位置・音量)を
       名前付きで保存し、後から選んで戻すレイアウト履歴。≡メニューの「配置」から開く。 -->
  <div id="layout-dialog" class="pos-dialog-overlay">
    <div class="pos-dialog pos-dialog-movable" role="dialog" aria-label="配置">
      <div class="pos-dialog-head">
        <span class="pos-dialog-title">📐 配置</span>
        <button id="layout-dialog-close" class="pos-dialog-x" type="button" title="閉じる">✕</button>
      </div>
      <div class="pos-dialog-body">
        <div class="layout-actions">
          <button id="layout-tile" class="layout-action" type="button" title="全部を均等に並べ直す">
            <span class="layout-action-title">⊞ 整列</span>
            <span class="layout-action-desc">均等に並べ直す</span>
          </button>
          <button id="layout-snap" class="layout-action" type="button" title="今の配置を保ったまま隙間をそろえる">
            <span class="layout-action-title">✨ 整形</span>
            <span class="layout-action-desc">今の配置のまま整える</span>
          </button>
        </div>
        <div class="layout-sec">現在のレイアウトを保存</div>
        <div class="layout-save-row">
          <input type="text" id="layout-name" class="tb-input" placeholder="保存名(省略で日時)" />
          <button id="layout-save" class="tb-btn tb-btn-primary" type="button">＋ 保存</button>
        </div>
        <div class="layout-sec">保存済み(タップでその配置に戻す)</div>
        <div id="layout-list" class="layout-list"></div>
      </div>
    </div>
  </div>

  <div id="perf-panel" hidden>
    <div class="perf-head">
      <span class="perf-title">📊 パフォーマンス</span>
      <button id="perf-close" type="button" title="閉じる">✕</button>
    </div>
    <div class="perf-rows"></div>
    <div class="perf-note">CPU/メモリは PC 全体の値。枠ごと・GPU は Chrome の Shift+Esc で。</div>
  </div>

  <div id="stage">
    <div id="stage-empty">
      <div class="empty-card">
        <div class="empty-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="empty-title">配信がありません</div>
        <div class="empty-hint">サイトを選ぶか URL を貼り付けて、視聴したい配信の枠を追加しましょう。</div>
        <button id="empty-add-btn" type="button">＋ 枠を追加</button>
      </div>
    </div>

    <div id="mixer-panel" class="mixer-panel" hidden>
      <div class="mixer-head">
        <span class="mixer-title">🎚 枠一覧 / ミキサー</span>
        <button id="mixer-close" class="mixer-x" type="button" title="閉じる">✕</button>
      </div>
      <div class="mixer-master">
        <span class="mixer-master-label">マスタ</span>
        <span id="mixer-master-icon">🔇</span>
        <input type="range" id="mixer-master" min="0" max="100" value="0" />
      </div>
      <div class="mixer-list"></div>
    </div>
  </div>
  <script src="hls.min.js"></script>
  <script src="multiview.js"></script>
</body>
</html>
